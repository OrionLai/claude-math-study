<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数一高数真题研习</title>
<meta name="description" content="考研数学一高等数学：1987–2025 年全部高数真题逐题详解、按考点从零讲起的基础讲解（含完整证明，陆续补全）、考频分析与预测、AI 辅导。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不阻塞渲染：先按 print 加载，加载完再对屏幕生效（见下面的脚本）；连不上 Google Fonts 时一直用系统字体 -->
<link rel="stylesheet" id="font-css" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" media="print">
<link rel="stylesheet" href="css/style.css">
<script>
  // 先应用保存的配色，避免页面闪一下
  try { var t0 = JSON.parse(localStorage.getItem('ky2-theme')); if (t0 === 'light' || t0 === 'dark') document.documentElement.setAttribute('data-theme', t0); } catch (e) {}
  (function (f) { if (f.sheet) f.media = 'all'; else f.addEventListener('load', function () { f.media = 'all'; }); })(document.getElementById('font-css'));
  // MathJax 用本站自带的同版本文件（js/vendor/mathjax）；它加载失败时再从 data-fallback 里的 cdnjs 地址加载
  window.addEventListener('error', function (e) {
    var s = e.target;
    if (!s || s.id !== 'mathjax-js' || !s.getAttribute('data-fallback')) return;
    var c = document.createElement('script');
    c.src = s.getAttribute('data-fallback');
    c.async = true;
    s.removeAttribute('data-fallback');
    document.head.appendChild(c);
  }, true);
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
    svg: { fontCache: 'global' },
    options: { enableMenu: false, ignoreHtmlClass: 'mj-lazy' },
    startup: {
      typeset: false,
      ready: function () {
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(function () {
          window.__mjReady = true;
          document.dispatchEvent(new Event('mj-ready'));
        });
      }
    }
  };
</script>
<script id="mathjax-js" src="js/vendor/mathjax/tex-svg.js" data-fallback="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
</head>
<body>
<a class="skip" href="#view">跳到正文</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" data-go="home">数一 · 高数<small>真题研习</small></a>
    <nav class="nav" aria-label="主导航">
      <!-- 手机上隐藏 .nav-x，标签缩成两个字，6 个入口一屏放得下 -->
      <a href="#home" data-go="home" data-nav="home">总览</a>
      <a href="#learn" data-go="learn" data-nav="learn"><span><span class="nav-x">基础</span>讲解</span></a>
      <a href="#bank" data-go="bank" data-nav="bank"><span>真题<span class="nav-x">库</span></span></a>
      <a href="#stats" data-go="stats" data-nav="stats"><span>考点<span class="nav-x">分析</span></span></a>
      <a href="#practice" data-go="practice" data-nav="practice"><span><span class="nav-x">随机</span>刷题</span></a>
      <a href="#wrong" data-go="wrong" data-nav="wrong"><span>错题<span class="nav-x">本</span></span> <span class="count" id="wrong-count" data-zero>0</span></a>
    </nav>
    <span class="top-tools">
      <button type="button" class="theme-btn" id="search-btn" aria-label="搜索考点、讲解和真题（Ctrl+K）" title="搜索考点、讲解和真题（Ctrl+K）" aria-haspopup="dialog"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="配色：跟随系统（点击切换）" title="配色：跟随系统（点击切换）"></button>
    </span>
  </div>
  <div class="readbar" id="readbar" hidden><i></i></div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="foot">
  <span>做题和学习记录只保存在当前浏览器，换手机或清缓存前请先导出。<span id="built"></span></span>
  <span class="foot-act">
    <span id="data-slot"><button type="button" id="export">导出记录</button><button type="button" id="import">导入记录</button></span>
    <span id="reset-slot"><button type="button" id="reset">清空做题与学习记录</button></span>
  </span>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</footer>

<button type="button" class="fab" data-ai-open aria-label="打开 AI 辅导">问 AI</button>
<div class="ai" id="ai" hidden role="dialog" aria-label="AI 辅导">
  <header class="ai-head">
    <b>AI 辅导</b><span class="ai-mode" id="ai-mode">正在检测…</span>
    <button type="button" class="ai-x" id="ai-close" aria-label="关闭">×</button>
  </header>
  <div class="ai-ctx" id="ai-ctx"></div>
  <div class="ai-log" id="ai-log" aria-live="polite"></div>
  <div class="ai-quick" id="ai-quick"></div>
  <form class="ai-form" id="ai-form">
    <label class="sr" for="ai-input">你的问题</label>
    <textarea id="ai-input" rows="3" placeholder="说说你卡在哪里（Ctrl + Enter 发送）"></textarea>
    <p class="ai-copy-hint" id="ai-copy-hint" hidden>现在没有连上 AI。点「复制问题」会把题目或讲解内容连同你的问题一起复制下来，打开任意 AI 聊天（如 claude.ai），粘贴到输入框里发送即可。想直接在这里问，在下面「连接设置」里填 API Key。</p>
    <div class="ai-send-row">
      <button type="submit" class="btn primary" id="ai-send">发送</button>
      <button type="button" class="btn" id="ai-stop" hidden>停止</button>
    </div>
  </form>
  <details class="ai-settings" id="ai-settings"><summary>连接设置</summary><div id="ai-settings-body"></div></details>
</div>
<dialog class="peek" id="peek" aria-labelledby="peek-title">
  <div class="peek-in">
    <header class="peek-head">
      <b class="peek-title" id="peek-title"></b>
      <a class="btn btn-small peek-open" href="#home" data-go="home">单独打开这道题</a>
      <button type="button" class="peek-x" data-peek-close aria-label="关闭">×</button>
    </header>
    <div class="peek-body"></div>
  </div>
</dialog>
<dialog class="sheet" id="sheet" aria-label="本篇目录">
  <div class="sheet-in">
    <header class="peek-head"><b>本篇目录</b><button type="button" class="peek-x" data-sheet-close aria-label="关闭">×</button></header>
    <nav class="sheet-body" aria-label="本篇小节"></nav>
  </div>
</dialog>
<dialog class="sheet search" id="search" aria-label="搜索">
  <div class="sheet-in">
    <header class="peek-head search-head">
      <svg viewBox="0 0 20 20" aria-hidden="true" class="search-ico"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <label class="sr" for="search-q">搜索考点、讲解和真题</label>
      <input type="search" id="search-q" placeholder="搜考点、讲解小节、真题…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="search-list">
      <button type="button" class="peek-x" data-search-close aria-label="关闭">×</button>
    </header>
    <div class="search-list" id="search-list" role="listbox" aria-label="搜索结果" data-nofit></div>
    <p class="search-foot"><kbd>↑</kbd> <kbd>↓</kbd> 选择　<kbd>Enter</kbd> 打开　<kbd>Esc</kbd> 关闭</p>
  </div>
</dialog>
<button type="button" class="fab fab-toc" id="toc-btn" hidden aria-haspopup="dialog">目录</button>
<div class="tip" id="tip" hidden role="tooltip"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="js/core.js"></script>
<script src="data/meta.js"></script>
<script src="js/card.js"></script>
<script src="js/views-learn.js"></script>
<script src="js/views-bank.js"></script>
<script src="js/views-stats.js"></script>
<script src="js/search.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
