<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数一高数真题研习</title>
<meta name="description" content="考研数学一高等数学复习站：按大纲 8 章整理历年真题，每题配完整解析、易错提醒，支持错题本和随机刷题。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
    svg: { fontCache: 'global' },
    options: { enableMenu: false, ignoreHtmlClass: 'mj-lazy' },
    startup: {
      typeset: false,
      ready: function () {
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(function () {
          window.__mjReady = true;
          document.dispatchEvent(new Event('mj-ready'));
        });
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" data-go="home">数一 · 高数<small>真题研习</small></a>
    <nav class="nav" aria-label="主导航">
      <a href="#home" data-go="home" data-nav="home">总览</a>
      <a href="#practice" data-go="practice" data-nav="practice">随机刷题</a>
      <a href="#wrong" data-go="wrong" data-nav="wrong">错题本 <span class="count" id="wrong-count">0</span></a>
    </nav>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="foot">
  <span>做题标记只保存在当前浏览器，换设备或清除浏览器数据后不会保留。</span>
  <span id="reset-slot"><button type="button" id="reset">清空做题记录</button></span>
</footer>
<script src="js/chapters.js"></script>
<script src="js/problems.js"></script>
<script src="js/app.js"></script>
</body>
</html>
